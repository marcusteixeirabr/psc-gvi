name: Deploy psc-gvi

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build e Deploy para VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Build binário Linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o psc-gvi \
            ./cmd/server/

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Transferir binário para VPS
        run: |
          scp -i ~/.ssh/id_ed25519 \
            psc-gvi \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/psc-gvi/psc-gvi

      - name: Executar deploy na VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "bash /opt/psc-gvi/deploy.sh"
