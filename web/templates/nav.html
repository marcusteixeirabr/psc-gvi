{{define "nav"}}
<nav style="background:#1a365d;color:white;padding:0.75rem 1.5rem;display:flex;align-items:center;gap:1.5rem;font-size:0.9rem;">
  <strong style="margin-right:auto">PSC GVI — DelItajaí</strong>
  <a href="/" style="color:#90cdf4;text-decoration:none">Dashboard</a>
  <a href="/vessels" style="color:#90cdf4;text-decoration:none">Navios</a>
  <a href="/escalas" style="color:#90cdf4;text-decoration:none">Escalas</a>
  <a href="/relatorio" style="color:#90cdf4;text-decoration:none">Relatório</a>
  {{if eq .User.Role "admin"}}<a href="/admin/health" style="color:#68d391;text-decoration:none">⚙ Saúde</a>{{end}}
  {{if eq .User.Role "admin"}}<a href="/admin/users" style="color:#68d391;text-decoration:none">👥 Usuários</a>{{end}}
  <form method="GET" action="/vessels" style="margin:0;display:flex;gap:0.4rem;align-items:center;">
    <input name="q" type="text" placeholder="Navio ou IMO"
      style="padding:0.3rem 0.6rem;border-radius:4px;border:1px solid #4a5568;background:#2d3748;color:white;font-size:0.82rem;width:150px;">
    <button type="submit" style="background:#4a5568;border:none;color:white;padding:0.3rem 0.6rem;border-radius:4px;cursor:pointer;font-size:0.8rem;">🔍</button>
  </form>
  <span style="color:#a0aec0">{{.User.DisplayName}}</span>
  <form method="POST" action="/logout" style="margin:0">
    <button style="background:none;border:1px solid #4a5568;color:#a0aec0;padding:0.25rem 0.6rem;border-radius:4px;cursor:pointer;font-size:0.85rem">Sair</button>
  </form>
</nav>
{{end}}
