name: Deploy psc-gvi

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build e Deploy para VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Build binário Linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o psc-gvi \
            ./cmd/server/

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS ao known_hosts
        run: ssh-keyscan ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Testar conectividade SSH
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH OK'"

      - name: Transferir binário para VPS
        run: |
          cat psc-gvi | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /opt/psc-gvi/psc-gvi.new && chmod +x /opt/psc-gvi/psc-gvi.new && mv /opt/psc-gvi/psc-gvi.new /opt/psc-gvi/psc-gvi"

      - name: Executar deploy na VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "bash /opt/psc-gvi/deploy.sh"
